<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B1G Timer - Stage Display</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        html, body {
            width:100vw; height:100vh; overflow:hidden;
            background:#000; color:#fff;
            font-family: 'Courier New', 'Monaco', 'Menlo', monospace;
        }

        .stage-wrap {
            width:100%; height:100%;
            display:flex; flex-direction:column;
            justify-content:center; align-items:center;
            position:relative;
        }

        /* Countdown */
        .countdown-display {
            font-size: 22vw;
            font-weight:700;
            font-variant-numeric:tabular-nums;
            letter-spacing:.04em;
            line-height:1;
            text-align:center;
            color:#fff;
            padding-bottom:2vh;
        }
        .countdown-display.negative {
            color: #ef4444;
        }

        /* Divider line */
        .stage-divider {
            width:70%;
            height:2px;
            background:rgba(255,255,255,.15);
            margin:1.5vh 0;
        }

        /* Current time */
        .current-time-display {
            font-size:6vw;
            font-weight:400;
            font-variant-numeric:tabular-nums;
            color:rgba(255,255,255,.5);
            letter-spacing:.03em;
            padding-top:1vh;
        }

        /* Timer name */
        .timer-name {
            position:absolute;
            top:2vh;
            left:50%;
            transform:translateX(-50%);
            font-size:2vw;
            color:rgba(255,255,255,.35);
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
            font-weight:500;
            letter-spacing:.04em;
            text-transform:uppercase;
        }

        /* Room name */
        .room-name {
            position:absolute;
            top:1.5vh;
            left:1.5vw;
            font-size:1.2vw;
            color:rgba(255,255,255,.25);
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
            font-weight:400;
            letter-spacing:.03em;
        }

        /* Blackout overlay */
        .blackout-overlay {
            position:fixed; inset:0;
            background:#000;
            display:none;
            z-index:100;
        }
        .blackout-overlay.active { display:block; }

        /* Message ribbon */
        .message-ribbon {
            position:fixed;
            bottom:3vh;
            left:5vw; right:5vw;
            background:rgba(0,0,0,.85);
            border:1px solid rgba(255,255,255,.15);
            border-radius:8px;
            padding:1.5vw 2vw;
            display:none;
            overflow:hidden;
            align-items:center;
            justify-content:center;
            text-align:center;
            backdrop-filter:blur(10px);
            z-index:50;
        }
        .message-ribbon.visible { display:flex; }
        .message-ribbon-text {
            font-size:3vw;
            font-weight:700;
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
            line-height:1.3;
            word-break:break-word;
            white-space:nowrap;
        }
        .message-ribbon.bold .message-ribbon-text { font-weight:900; }

        /* Scrolling message animation */
        .message-ribbon.scrolling {
            justify-content:flex-start;
        }
        .message-ribbon.scrolling .message-ribbon-text {
            display:inline-block;
            white-space:nowrap;
            will-change:transform;
            animation:scrollMessage var(--scroll-duration, 10s) linear infinite;
        }
        .message-ribbon.scroll-right .message-ribbon-text {
            animation-name:scrollMessageRight;
        }
        @keyframes scrollMessage {
            0% { transform:translateX(90vw); }
            100% { transform:translateX(-100%); }
        }
        @keyframes scrollMessageRight {
            0% { transform:translateX(-100%); }
            100% { transform:translateX(90vw); }
        }
        .message-ribbon:not(.scrolling) .message-ribbon-text {
            white-space:normal;
        }
        .message-ribbon.msg-bg-transparent {
            background:transparent;
            border-color:transparent;
            backdrop-filter:none;
        }

        /* Color classes */
        .color-white { color:#fff; }
        .color-green { color:#00ff00; }
        .color-red { color:#ff0000; }
        .color-yellow { color:#ffff00; }

        /* Connection status dot - hidden */
        .connection-status { display:none; }

        /* Waiting state */
        .countdown-display.waiting {
            color:rgba(255,255,255,.5);
        }

        /* Stage Transport Controls */
        .stage-transport {
            position:fixed;
            bottom:0; left:0; right:0;
            display:flex;
            justify-content:center;
            align-items:center;
            gap:1.2vw;
            padding:1.5vh 2vw;
            background:linear-gradient(transparent, rgba(0,0,0,.85));
            opacity:0;
            transition:opacity .3s ease;
            z-index:60;
        }
        .stage-transport:hover,
        .stage-transport.visible {
            opacity:1;
        }
        .stage-transport-btn {
            width:clamp(36px, 4vw, 56px);
            height:clamp(36px, 4vw, 56px);
            border:1px solid rgba(255,255,255,.2);
            border-radius:8px;
            background:rgba(255,255,255,.08);
            color:rgba(255,255,255,.7);
            font-size:clamp(14px, 1.8vw, 22px);
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
            transition:background .2s, color .2s;
        }
        .stage-transport-btn:hover {
            background:rgba(255,255,255,.18);
            color:#fff;
        }
        .stage-transport-btn.play {
            background:rgba(59,130,246,.5);
            border-color:rgba(59,130,246,.7);
            color:#fff;
        }
        .stage-transport-btn.play:hover {
            background:rgba(59,130,246,.7);
        }
        .stage-transport-btn.play.running {
            background:rgba(239,68,68,.5);
            border-color:rgba(239,68,68,.7);
        }
        .stage-transport-btn.play.running:hover {
            background:rgba(239,68,68,.7);
        }

        /* Utility buttons (right-aligned group) */
        .stage-transport-utils {
            position:fixed;
            bottom:0; right:0;
            display:flex;
            align-items:center;
            gap:.8vw;
            padding:1.5vh 2vw;
            background:linear-gradient(transparent, rgba(0,0,0,.85));
            opacity:0;
            transition:opacity .3s ease;
            z-index:60;
        }
        body:hover .stage-transport-utils,
        .stage-transport-utils:hover,
        .stage-transport-utils.visible {
            opacity:1;
        }

        /* Bible Display Overlay */
        .bible-display {
            position:fixed; inset:0;
            display:none;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            z-index:40;
            padding:5vh 6vw;
            background:#000;
        }
        .bible-display.visible { display:flex; }
        .bible-display .bible-verse-text {
            font-family:'Georgia', serif;
            font-size:5vw;
            color:#fff;
            line-height:1.5;
            text-align:center;
            word-break:break-word;
            max-width:90vw;
        }
        .bible-display .bible-reference {
            margin-top:3vh;
            font-family:'Georgia', serif;
            font-size:2.5vw;
            color:rgba(255,255,255,.75);
            text-align:center;
        }
        /* Lower Third layout */
        .bible-display.bible-lower-third {
            justify-content:flex-end;
            padding-bottom:5vh;
            background:transparent;
        }
        .bible-display.bible-lower-third::before {
            content:'';
            position:absolute;
            left:0; right:0; bottom:0;
            height:35%;
            background:linear-gradient(transparent, rgba(0,0,0,.85));
            pointer-events:none;
        }
        .bible-display.bible-lower-third .bible-verse-text {
            text-align:left;
            max-width:80vw;
            z-index:1;
        }
        .bible-display.bible-lower-third .bible-reference {
            text-align:left;
            align-self:flex-start;
            margin-left:6vw;
            z-index:1;
        }
        /* Reference positions */
        .bible-display.bible-ref-bottom-center .bible-reference { text-align:center; }
        .bible-display.bible-ref-bottom-right .bible-reference { text-align:right; align-self:flex-end; }
        .bible-display.bible-ref-top-right .bible-reference { position:absolute; top:3vh; right:4vw; }
        .bible-display.bible-ref-inline-right .bible-reference { align-self:flex-end; margin-right:6vw; }
        /* Text alignment */
        .bible-display.bible-align-left .bible-verse-text { text-align:left; }
        .bible-display.bible-align-right .bible-verse-text { text-align:right; }
        /* Gradient background */
        .bible-display.bible-bg-gradient { background:linear-gradient(135deg, #1a1a2e, #16213e); }
        /* Image background */
        .bible-display.bible-bg-image {
            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
        }
        .bible-display.bible-bg-image::after {
            content:'';
            position:absolute;
            inset:0;
            background:rgba(0,0,0,.45);
            pointer-events:none;
        }
        .bible-display.bible-bg-image .bible-verse-text,
        .bible-display.bible-bg-image .bible-reference {
            position:relative;
            z-index:1;
            text-shadow:0 2px 8px rgba(0,0,0,.8);
        }
    </style>
</head>
<body>
    <!-- Blackout Overlay -->
    <div class="blackout-overlay" id="blackout-overlay"></div>

    <!-- Connection Status -->
    <div class="connection-status" id="connection-status"></div>

    <!-- Main Stage -->
    <div class="stage-wrap">
        <div class="room-name" id="room-name"></div>
        <div class="timer-name" id="timer-name"></div>
        <div class="countdown-display waiting" id="countdown">0:00</div>
        <div class="stage-divider"></div>
        <div class="current-time-display" id="time-of-day">12:00:00 AM</div>
    </div>

    <!-- Message Ribbon -->
    <div class="message-ribbon" id="message-ribbon">
        <div class="message-ribbon-text" id="message-text"></div>
    </div>

    <!-- Bible Display Overlay -->
    <div class="bible-display" id="bible-display">
        <div class="bible-verse-text" id="bible-verse-text"></div>
        <div class="bible-reference" id="bible-reference"></div>
    </div>

    <!-- Stage Transport Controls (visible on hover) -->
    <div class="stage-transport" id="stage-transport">
        <button class="stage-transport-btn" id="stage-btn-previous" title="Previous Timer"><i class="fas fa-step-backward"></i></button>
        <button class="stage-transport-btn play" id="stage-btn-play-pause" title="Play/Pause"><i class="fas fa-play"></i></button>
        <button class="stage-transport-btn" id="stage-btn-next" title="Next Timer"><i class="fas fa-step-forward"></i></button>
    </div>

    <!-- Utility buttons: PiP + Fullscreen -->
    <div class="stage-transport-utils" id="stage-transport-utils">
        <button class="stage-transport-btn" id="stage-btn-pip" title="Picture-in-Picture"><i class="fas fa-clone"></i></button>
        <button class="stage-transport-btn" id="stage-btn-fullscreen" title="Toggle Fullscreen"><i class="fas fa-expand"></i></button>
    </div>

    <!-- Pusher SDK -->
    <script src="https://js.pusher.com/8.2/pusher.min.js"></script>
    
    <!-- JS Modules -->
    <script src="js/api-client.js?v=3"></script>
    <script src="js/timer-math.js?v=3"></script>
    <script src="js/state-manager.js?v=3"></script>
    <script src="js/pusher-manager.js?v=3"></script>
    <script src="js/room-picker.js?v=1"></script>
    <script src="js/message-manager.js?v=3"></script>
    <script src="js/bible-display.js?v=1"></script>
    <script src="js/stage-display-enhancements.js?v=3"></script>
    <script src="js/stage-display.js?v=7"></script>
</body>
</html>
